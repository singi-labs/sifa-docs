name: Showcase health

# Checks the "personal sites driven by a Sifa profile" showcase
# (content/data/site-showcase.json) stays live and Sifa-driven.
#
# For every entry: the displayed URL must return 2xx (catches 404s and lapsed
# domains), and — where a per-entry marker is declared — that marker must still
# be present in the delivered page or its same-origin JS (catches a site that
# redesigned away from Sifa). `manual` entries are surfaced for a human but do
# not fail the run. Logic + rationale: scripts/check-showcase.ts.
#
# Triggers:
# - on PRs that touch the showcase data or its checker, so a new entry is
#   verified live before it merges. Strict: a dead or drifted entry fails.
# - daily (05:00 UTC), and manually via workflow_dispatch. These runs track
#   instead of failing: a dead or drifted entry gets `downSince` in
#   site-showcase.json, which hides it on the page, and a clean check clears
#   it again. The change lands through a PR this job opens and merges with
#   SDK_BUMP_PR_TOKEN (a GITHUB_TOKEN merge would not trigger the deploy).
#   An entry down for a week opens (or updates) one issue; it closes when
#   none is. See scripts/link-health.ts.

on:
  pull_request:
    branches: [main]
    paths:
      - 'content/data/site-showcase.json'
      - 'scripts/showcase.ts'
      - 'scripts/check-showcase.ts'
      - '.github/workflows/showcase-health.yml'
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: showcase-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check:showcase:test

      - name: Check showcase sites
        if: github.event_name == 'pull_request'
        run: pnpm check:showcase

      - name: Track showcase sites
        if: github.event_name != 'pull_request'
        env:
          SHOWCASE_TRACK: '1'
        run: pnpm check:showcase

      - name: Build the site with the new state
        if: github.event_name != 'pull_request'
        run: pnpm build

      - name: Open PR on change
        id: cpr
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.SDK_BUMP_PR_TOKEN }}
          add-paths: content/data/site-showcase.json
          branch: chore/showcase-health
          delete-branch: true
          commit-message: 'chore(showcase): update site health'
          title: 'chore(showcase): update site health'
          body: |
            The daily showcase check found a site dead or drifted (hidden from
            the page via `downSince`), or back again. Merged automatically once
            the site builds.

      - name: Merge the update
        if: github.event_name != 'pull_request' && steps.cpr.outputs.pull-request-number != '' && steps.cpr.outputs.pull-request-operation != 'none'
        env:
          GH_TOKEN: ${{ secrets.SDK_BUMP_PR_TOKEN }}
        run: gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --squash --delete-branch

      - name: Open, update or close the week-down issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'Showcase site down for 7+ days'
          REPORT: .link-health/showcase.md
        run: |
          number=$(gh issue list --state open --label link-rot --search "in:title \"$TITLE\"" \
            --json number,title --jq ".[] | select(.title == env.TITLE) | .number" | head -n 1)
          if [ -f "$REPORT" ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file "$REPORT"
            else
              gh issue create --title "$TITLE" --body-file "$REPORT" --label docs,link-rot,automated
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "No showcase site has been down for 7 days anymore."
          fi
